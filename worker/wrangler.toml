# AliLLM proxy — holds the Mistral key server-side.
# Deploy:  npx wrangler deploy            (from this folder)
# Secret:  npx wrangler secret put MISTRAL_API_KEY
name = "alillm-proxy"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Mistral model. The free plan allows ministral-8b-latest (2 req/min); on a paid plan switch to mistral-small-latest.
MODEL = "ministral-8b-latest"
# Exact origins allowed to call /chat (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://aliamrrr.github.io,http://localhost:5173,http://localhost:4173"

# Exact rate limits (8/min per IP, 300/day site-wide) are counted in this Durable Object.
[[durable_objects.bindings]]
name = "CHAT_DO_LIMITER"
class_name = "ChatRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRateLimiter"]
