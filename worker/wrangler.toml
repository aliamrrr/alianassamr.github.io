# AliLLM proxy — holds the Mistral key server-side.
# Deploy:  npx wrangler deploy            (from this folder)
# Secret:  npx wrangler secret put MISTRAL_API_KEY
name = "alillm-proxy"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Exact origins allowed to call /chat (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://aliamrrr.github.io,http://localhost:5173,http://localhost:4173"

# Per-IP limit: 8 questions per minute.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
